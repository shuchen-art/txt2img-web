name = "txt2img-api"
main = "src/index.js"
compatibility_date = "2026-04-01"

[vars]
DEEPSEEK_MODEL = "deepseek-flash"
# Set this to your GitHub Pages origin (scheme + host only, no path/trailing slash),
# e.g. "https://your-username.github.io"
ALLOWED_ORIGINS = "https://chenshu-art.github.io"

[[durable_objects.bindings]]
name = "SESSIONS"
class_name = "DrawingSession"

[[migrations]]
tag = "v1"
new_sqlite_classes = ["DrawingSession"]
